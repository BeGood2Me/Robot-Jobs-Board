name: ingest-jobs

on:
  workflow_dispatch:
  schedule:
    # Full board refresh (every seeded company in one export).
    # Reliability: Vercel Cron (vercel.json, Hobby = 1/day) is the primary morning
    # trigger; GitHub `schedule` is best-effort and can skip days.
    # Times are UTC. 07:00 = 08:00 Ireland (IST). After clocks go back, bump to 08:00 UTC.
    # 10:00 UTC catch-up runs only if the snapshot is stale (see freshness step).
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "53 19 * * *"
  repository_dispatch:
    types: [ingest-jobs]

concurrency:
  group: ingest-jobs
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Skip near-duplicate collisions only. Window is 6h so:
      # - 07:00 + 10:00 catch-up: catch-up skips if morning already ran
      # - morning + evening (~13h apart): both still run
      # - missed morning: catch-up still fires (snapshot from prior evening is >6h)
      - name: Skip schedule if snapshot was just rebuilt
        id: freshness
        if: github.event_name == 'schedule'
        env:
          SNAPSHOT_BASE_URL: ${{ secrets.SNAPSHOT_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${SNAPSHOT_BASE_URL:-}"
          if [ -z "$BASE" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "SNAPSHOT_BASE_URL unset — running ingest"
            exit 0
          fi
          BASE="${BASE%/}"
          if ! curl -fsS "$BASE/manifest.json" -o /tmp/manifest.json; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Remote manifest missing — running ingest"
            exit 0
          fi
          AGE_HOURS=$(node -e "const m=require('/tmp/manifest.json'); console.log(((Date.now()-Date.parse(m.generatedAt))/36e5).toFixed(2))")
          echo "Snapshot age: ${AGE_HOURS}h"
          if node -e "const m=require('/tmp/manifest.json'); process.exit((Date.now()-Date.parse(m.generatedAt))/36e5 < 6 ? 0 : 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot just rebuilt (<6h) — skipping duplicate schedule"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.freshness.outputs.skip != 'true'
      # Local codegen only — does not connect to Neon.
      - run: pnpm db:generate
        if: steps.freshness.outputs.skip != 'true'
      - name: Export snapshot and upload to Vercel Blob
        id: upload
        if: steps.freshness.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BLOB_READ_WRITE_TOKEN:-}" ]; then
            echo "BLOB_READ_WRITE_TOKEN secret is not set"
            exit 1
          fi
          pnpm snapshot:export:feeds:upload | tee /tmp/snapshot-upload.log
          BOARD=$(node -e "const fs=require('fs'); const lines=fs.readFileSync('/tmp/snapshot-upload.log','utf8').trim().split(/\n/); const row=JSON.parse(lines.at(-1)); if(!row.snapshotBaseUrl||!row.jobCount) process.exit(1); console.log(row.snapshotBaseUrl); console.error(JSON.stringify(row))")
          JOB_COUNT=$(node -e "const fs=require('fs'); const lines=fs.readFileSync('/tmp/snapshot-upload.log','utf8').trim().split(/\n/); console.log(JSON.parse(lines.at(-1)).jobCount)")
          if [ "$JOB_COUNT" -lt 1 ]; then
            echo "Refusing empty snapshot (jobCount=$JOB_COUNT)"
            exit 1
          fi
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "job_count=$JOB_COUNT" >> "$GITHUB_OUTPUT"
          echo "snapshot_base_url=$BOARD" >> "$GITHUB_OUTPUT"

      # No Vercel deploy — Blob is live immediately. Bust Next.js Data Cache only.
      - name: Revalidate Next.js board cache
        if: steps.freshness.outputs.skip != 'true' && steps.upload.outputs.uploaded == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.robotjobsboard.com
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not set — skipping on-demand revalidate"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"; then
              echo
              echo "Board cache revalidated"
              exit 0
            fi
            echo "Revalidate attempt ${attempt}/5 failed; retrying…"
            sleep $((attempt * 5))
          done
          echo "Revalidate did not succeed; Data Cache TTL will expire within an hour"
          exit 0
