name: ingest-jobs

on:
  workflow_dispatch:
  schedule:
    # Once daily at 06:00 UTC — keeps Neon egress low on free tier.
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - 'apps/web/public/snapshot/**'

concurrency:
  group: ingest-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can rebase onto main if it moved during the long ingest.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      # Version is read from packageManager in package.json — do not also pass version: here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - run: pnpm ingest:run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          INGEST_INACTIVE_AFTER_DAYS: "1"
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
      - run: pnpm snapshot:export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
      - name: Commit public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f apps/web/public/snapshot/board.json.gz ]; then
            echo "Snapshot export did not write apps/web/public/snapshot/board.json.gz"
            exit 1
          fi
          git add apps/web/public/snapshot/
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore: update public snapshot"
          # main may have moved during the ~1h ingest (code pushes, other runs)
          git pull --rebase origin main
          git push origin HEAD:main
