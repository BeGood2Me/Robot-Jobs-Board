name: ingest-jobs

on:
  workflow_dispatch:
  schedule:
    # Full board refresh (every seeded company in one export).
    # Reliability: Vercel Cron (vercel.json, Hobby = 1/day) is the primary morning
    # trigger; GitHub `schedule` is best-effort and can skip days.
    # Times are UTC. 07:00 = 08:00 Ireland (IST). After clocks go back, bump to 08:00 UTC.
    # 10:00 UTC catch-up runs only if the snapshot is stale (see freshness step).
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "53 19 * * *"
  repository_dispatch:
    types: [ingest-jobs]

concurrency:
  group: ingest-jobs
  # One full export at a time. Overlapping runs previously conflicted on
  # board.json.gz during `git pull --rebase` and failed the job.
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Skip near-duplicate collisions only. Window is 6h so:
      # - 07:00 + 10:00 catch-up: catch-up skips if morning already ran
      # - morning + evening (~13h apart): both still run
      # - missed morning: catch-up still fires (snapshot from prior evening is >6h)
      - name: Skip schedule if snapshot was just rebuilt
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          MANIFEST="apps/web/public/snapshot/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE_HOURS=$(node -e "const m=require('./$MANIFEST'); console.log(((Date.now()-Date.parse(m.generatedAt))/36e5).toFixed(2))")
          echo "Snapshot age: ${AGE_HOURS}h"
          if node -e "const m=require('./$MANIFEST'); process.exit((Date.now()-Date.parse(m.generatedAt))/36e5 < 6 ? 0 : 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot just rebuilt (<6h) — skipping duplicate schedule"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.freshness.outputs.skip != 'true'
      # Local codegen only — does not connect to Neon.
      - run: pnpm db:generate
        if: steps.freshness.outputs.skip != 'true'
      - run: pnpm snapshot:export:feeds
        if: steps.freshness.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
      - name: Commit public snapshot
        id: commit
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f apps/web/public/snapshot/board.json.gz ]; then
            echo "Snapshot export did not write apps/web/public/snapshot/board.json.gz"
            exit 1
          fi
          JOB_COUNT=$(node -e "console.log(require('./apps/web/public/snapshot/manifest.json').jobCount)")
          if [ "$JOB_COUNT" -lt 1 ]; then
            echo "Refusing to commit empty snapshot (jobCount=$JOB_COUNT)"
            exit 1
          fi

          # Keep a copy of the freshly exported snapshot. Binary gzip files do not
          # rebase cleanly when another ingest lands on main mid-push.
          SNAPSHOT_BACKUP=$(mktemp -d)
          cp -a apps/web/public/snapshot/. "$SNAPSHOT_BACKUP/"

          restore_snapshot() {
            rm -rf apps/web/public/snapshot
            mkdir -p apps/web/public/snapshot
            cp -a "$SNAPSHOT_BACKUP"/. apps/web/public/snapshot/
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            restore_snapshot
            git add apps/web/public/snapshot/
            if git diff --staged --quiet; then
              echo "No snapshot changes to commit"
              exit 0
            fi
            git commit -m "chore: update public snapshot"
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); retrying on latest main"
            sleep $((attempt * 2))
          done

          echo "Failed to push snapshot after retries"
          exit 1

      # Snapshot pushes deploy via Vercel Git. Do not also fire the deploy hook —
      # ignoreCommand used to skip Git builds for these commits, which canceled
      # both the Git build and the hook, leaving production on a stale snapshot.
      - name: Revalidate Next.js board cache
        if: steps.freshness.outputs.skip != 'true' && steps.commit.outputs.pushed == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.robotjobsboard.com
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not set — skipping on-demand revalidate"
            exit 0
          fi
          # Wait for the Vercel Git production build to promote static snapshot files.
          echo "Waiting for production deploy before cache bust…"
          sleep 120
          for attempt in 1 2 3 4 5; do
            if curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"; then
              echo
              echo "Board cache revalidated"
              exit 0
            fi
            echo "Revalidate attempt ${attempt}/5 failed; retrying…"
            sleep $((attempt * 15))
          done
          echo "Revalidate did not succeed (deploy may still be building); Data Cache TTL will expire within an hour"
          exit 0
