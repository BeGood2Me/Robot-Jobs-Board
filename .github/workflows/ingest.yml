name: ingest-jobs

on:
  workflow_dispatch:
  schedule:
    # Full board refresh (every seeded company in one export).
    # Reliability: Vercel Cron (vercel.json, Hobby = 1/day) is the primary morning
    # trigger; GitHub `schedule` is best-effort and can skip days.
    # Times are UTC. 07:00 = 08:00 Ireland (IST). After clocks go back, bump to 08:00 UTC.
    # 10:00 UTC catch-up runs only if the snapshot is stale (see freshness step).
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "53 19 * * *"
  repository_dispatch:
    types: [ingest-jobs]

concurrency:
  group: ingest-jobs
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip schedule if snapshot was just rebuilt
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          CDN="https://raw.githubusercontent.com/BeGood2Me/Robot-Jobs-Board/snapshot-data/snapshot/manifest.json"
          if curl -fsSL "$CDN" -o /tmp/manifest.json; then
            AGE_HOURS=$(node -e "const m=require('/tmp/manifest.json'); console.log(((Date.now()-Date.parse(m.generatedAt))/36e5).toFixed(2))")
            echo "Snapshot age: ${AGE_HOURS}h"
            if node -e "const m=require('/tmp/manifest.json'); process.exit((Date.now()-Date.parse(m.generatedAt))/36e5 < 6 ? 0 : 1)"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Snapshot just rebuilt (<6h) — skipping duplicate schedule"
              exit 0
            fi
          else
            echo "CDN manifest unavailable — running ingest"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.freshness.outputs.skip != 'true'
      - run: pnpm db:generate
        if: steps.freshness.outputs.skip != 'true'

      - name: Export snapshot from ATS feeds
        id: export
        if: steps.freshness.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
          # Do not upload to Neon — free-tier transfer is exhausted; CDN is source of truth.
          SNAPSHOT_UPLOAD_DB: "0"
        run: |
          set -euo pipefail
          pnpm snapshot:export:feeds:upload | tee /tmp/snapshot-upload.log
          JOB_COUNT=$(node -e "
            const fs=require('fs');
            const lines=fs.readFileSync('/tmp/snapshot-upload.log','utf8').trim().split(/\n/).filter(Boolean);
            const line=lines.reverse().find(l=>l.includes('snapshot.export.feeds'));
            if(!line) process.exit(1);
            const row=JSON.parse(line);
            const n=row.jobCount;
            if(!n||n<1) process.exit(1);
            console.log(n);
          ")
          echo "exported=true" >> "$GITHUB_OUTPUT"
          echo "job_count=$JOB_COUNT" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to GitHub CDN branch (jsDelivr)
        id: cdn
        if: steps.freshness.outputs.skip != 'true' && steps.export.outputs.exported == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="apps/web/public/snapshot"
          test -f "$SRC/manifest.json"
          test -f "$SRC/board.json.gz"
          test -f "$SRC/bodies.json.gz"
          GENERATED=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$SRC/manifest.json','utf8')).generatedAt)")

          WORK=$(mktemp -d)
          cd "$WORK"
          git init -b snapshot-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir snapshot
          cp -r "$GITHUB_WORKSPACE/$SRC"/. snapshot/
          git add snapshot
          git commit -m "snapshot ${GENERATED}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:snapshot-data
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Revalidate Next.js board cache
        if: steps.freshness.outputs.skip != 'true' && steps.cdn.outputs.published == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://www.robotjobsboard.com
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not set — skipping on-demand revalidate"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS -X POST "$SITE_URL/api/revalidate" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json"; then
              echo
              echo "Board cache revalidated"
              exit 0
            fi
            echo "Revalidate attempt ${attempt}/5 failed; retrying…"
            sleep $((attempt * 5))
          done
          echo "Revalidate did not succeed; Data Cache TTL will expire within an hour"
          exit 0
