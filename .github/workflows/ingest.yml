name: ingest-jobs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is best-effort. Offset slots are a backup; Vercel Cron is the
    # reliable daily trigger (dispatches this workflow, no Neon).
    - cron: "23 7 * * *"
    - cron: "53 19 * * *"
  repository_dispatch:
    types: [ingest-jobs]

concurrency:
  group: ingest-jobs
  # One export at a time. Overlapping runs previously conflicted on board.json.gz
  # during `git pull --rebase` and failed the job.
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip schedule if snapshot is already fresh
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          MANIFEST="apps/web/public/snapshot/manifest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE_HOURS=$(node -e "const m=require('./$MANIFEST'); console.log(((Date.now()-Date.parse(m.generatedAt))/36e5).toFixed(2))")
          echo "Snapshot age: ${AGE_HOURS}h"
          if node -e "const m=require('./$MANIFEST'); process.exit((Date.now()-Date.parse(m.generatedAt))/36e5 < 14 ? 0 : 1)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot already fresh (<14h) — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.freshness.outputs.skip != 'true'
      # Local codegen only — does not connect to Neon.
      - run: pnpm db:generate
        if: steps.freshness.outputs.skip != 'true'
      - run: pnpm snapshot:export:feeds
        if: steps.freshness.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SITE_URL: https://www.robotjobsboard.com
          NODE_ENV: production
      - name: Commit public snapshot
        id: commit
        if: steps.freshness.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ ! -f apps/web/public/snapshot/board.json.gz ]; then
            echo "Snapshot export did not write apps/web/public/snapshot/board.json.gz"
            exit 1
          fi
          JOB_COUNT=$(node -e "console.log(require('./apps/web/public/snapshot/manifest.json').jobCount)")
          if [ "$JOB_COUNT" -lt 1 ]; then
            echo "Refusing to commit empty snapshot (jobCount=$JOB_COUNT)"
            exit 1
          fi

          # Keep a copy of the freshly exported snapshot. Binary gzip files do not
          # rebase cleanly when another ingest lands on main mid-push.
          SNAPSHOT_BACKUP=$(mktemp -d)
          cp -a apps/web/public/snapshot/. "$SNAPSHOT_BACKUP/"

          restore_snapshot() {
            rm -rf apps/web/public/snapshot
            mkdir -p apps/web/public/snapshot
            cp -a "$SNAPSHOT_BACKUP"/. apps/web/public/snapshot/
          }

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            restore_snapshot
            git add apps/web/public/snapshot/
            if git diff --staged --quiet; then
              echo "No snapshot changes to commit"
              exit 0
            fi
            git commit -m "chore: update public snapshot"
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5); retrying on latest main"
            sleep $((attempt * 2))
          done

          echo "Failed to push snapshot after retries"
          exit 1

      # GitHub→Vercel webhooks can miss bot pushes (seen 2026-09-11). Always
      # trigger a production deploy hook after a successful snapshot push.
      - name: Trigger Vercel production deploy
        if: steps.freshness.outputs.skip != 'true' && steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          # Give Git a moment to expose the new commit to Vercel's Git integration.
          sleep 8
          echo "Triggering Vercel deploy hook…"
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "Deploy hook accepted"
